name = "dc-forest-tracker"
main = "worker.js"
compatibility_date = "2026-10-01"

# The static website (index.html, assets/, sw.js) served by the same Worker, so live.json is same-origin.
[assets]
directory = ".."
binding = "ASSETS"
run_worker_first = ["/live.json"]

[[kv_namespaces]]
binding = "SNAP"
id = "REPLACE_WITH_KV_ID"   # wrangler kv namespace create SNAP

[triggers]
crons = ["*/5 * * * *"]

# Secrets (never in this file):  wrangler secret put PORTAL_USER ; wrangler secret put PORTAL_PASS
