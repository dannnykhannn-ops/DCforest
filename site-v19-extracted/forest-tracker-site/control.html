<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control Room — DC Forest</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#071a0d">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#071a0d; --surface:#0f2a16; --surface2:#15361d; --text:#eef3e4; --muted:#a6b99a; --line:#23462b;
  --gold:#e0bb4b; --gold-light:#fcde84; --head-a:#06200d; --head-b:#0f3d1b;
  --moving:#4ade80; --idle:#ff7a2f; --stop:#fbbf24; --none:#9aa4b2; --weak:#fb7185;
  --panel:340px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh}

/* header */
.top{background:linear-gradient(90deg,var(--head-a),var(--head-b) 55%,var(--head-a));border-bottom:3px solid var(--gold);
  display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));flex-wrap:wrap;z-index:1000}
.top h1{font-family:"Playfair Display",Georgia,serif;font-size:1.15rem;margin:0;color:var(--gold-light);white-space:nowrap}
.top .sub{font-size:.74rem;color:var(--muted);display:block;font-family:Figtree,sans-serif;font-weight:600}
.back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;border:1px solid rgba(252,222,132,.45);color:var(--gold-light);text-decoration:none;flex:none}
.back svg{width:18px;height:18px}
.fresh{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.74rem;font-weight:800;background:rgba(74,222,128,.14);border:1px solid rgba(74,222,128,.5);color:#c8f5d6;white-space:nowrap}
.fresh i{width:8px;height:8px;border-radius:50%;background:var(--moving)}
.fresh.stale{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.55);color:#fde7a8}
.fresh.stale i{background:var(--stop)}
.fresh.demo{background:rgba(251,113,133,.16);border-color:rgba(251,113,133,.6);color:#ffd1da}
.fresh.demo i{background:var(--weak)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid rgba(252,222,132,.35);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 10px;font-size:.78rem;font-weight:700;color:var(--gold-light);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1a1400}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(252,222,132,.1);border:1px solid rgba(252,222,132,.45);color:var(--gold-light);
  border-radius:10px;padding:6px 10px;font-size:.78rem;font-weight:700;cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--gold);color:#1a1400;border-color:var(--gold)}
.tbtn svg{width:15px;height:15px}

/* body */
.main{position:relative;display:grid;grid-template-columns:var(--panel) 1fr;min-height:0}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:500}
.search{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.search input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:.9rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:4px 10px;font-size:.76rem;font-weight:700;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--k)}
.chip b{opacity:.75}
.chip[aria-pressed="true"]{border-color:var(--k);box-shadow:inset 0 0 0 1px var(--k);background:color-mix(in srgb,var(--k) 18%,var(--surface2))}
.list{overflow:auto;flex:1;padding:6px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;
  border-radius:12px;padding:8px;cursor:pointer}
.row:hover{background:var(--surface2)}
.row[aria-current="true"]{background:var(--surface2);border-color:var(--gold)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;color:#0a1f0e;background:var(--k);flex:none}
.row .nm{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mt{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;font-size:.72rem;color:var(--muted);white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;color:#0a1f0e;background:var(--k)}
.empty{padding:20px;color:var(--muted);text-align:center;font-size:.9rem}
#map{position:relative;min-height:0;background:#0b2412}

/* markers + always-on labels */
.mk{position:relative}
.mk .dot{width:22px;height:22px;border-radius:50%;background:var(--k);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);display:grid;place-items:center}
.mk .dot svg{width:12px;height:12px;color:#0a1f0e}
.mk.moving .dot{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--k) 70%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.mk .lab{position:absolute;left:26px;top:-1px;white-space:nowrap;background:rgba(7,26,13,.9);color:#fff;border:1px solid var(--k);border-radius:8px;
  padding:2px 7px;font-size:11.5px;font-weight:700;line-height:1.35;pointer-events:none}
.mk .lab small{display:block;font-weight:600;color:#cfe0c4;font-size:10.5px}
.mk.hide-lab .lab{display:none}
.mk.sel .dot{transform:scale(1.25);border-color:var(--gold)}
.mk.sel .lab{border-color:var(--gold);z-index:2}
.leaflet-container{font-family:inherit}
.leaflet-tooltip.tip{background:#0f2a16;color:var(--text);border:1px solid var(--gold);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:12px;padding:6px 9px}
.leaflet-tooltip.tip::before{display:none}

/* person card */
.card{position:absolute;top:12px;right:12px;width:min(360px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;z-index:900;
  background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--k);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:16px}
.card[hidden]{display:none}
.card .x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:1.1rem;line-height:1}
.card .hd{display:flex;gap:12px;align-items:center;padding-right:36px}
.card .av{width:52px;height:52px;font-size:1.05rem}
.card h2{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:1.2rem;line-height:1.2}
.card .ds{color:var(--muted);font-size:.82rem;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.kv{background:var(--surface2);border-radius:12px;padding:8px 10px}
.kv .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kv .v{font-weight:800;font-size:.95rem;margin-top:2px}
.kv .v small{font-weight:600;color:var(--muted);font-size:.75rem}
.kv.wide{grid-column:1/-1}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.act{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface2);text-decoration:none;font-weight:800;font-size:.82rem;cursor:pointer;color:var(--text)}
.act.primary{background:var(--gold);border-color:var(--gold);color:#1a1400}
.act svg{width:16px;height:16px}
.note{margin-top:12px;font-size:.74rem;color:var(--muted);line-height:1.45}
.dash{color:var(--muted)}

.mobile-tog{display:none}
@media (max-width:760px){
  .main{grid-template-columns:1fr}
  .side{position:absolute;left:0;right:0;bottom:0;height:46%;border-right:0;border-top:3px solid var(--gold);border-radius:18px 18px 0 0;
    transition:transform .3s ease;box-shadow:0 -10px 30px rgba(0,0,0,.4);padding-bottom:env(safe-area-inset-bottom)}
  .side.collapsed{transform:translateY(calc(100% - 52px))}
  .mobile-tog{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:transparent;border:0;padding:12px;font-weight:800;color:var(--gold-light);cursor:pointer}
  .mobile-tog::before{content:"";width:40px;height:4px;border-radius:4px;background:var(--line);position:absolute;top:6px;left:50%;transform:translateX(-50%)}
  .card{top:auto;bottom:0;right:0;left:0;width:auto;border-radius:18px 18px 0 0;max-height:58%;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .top h1 .sub{display:none}
  .hide-sm{display:none}
}

/* ================= Living Wall ================= */
html[data-skin="new"] body{background:#0a2210 url(assets/v2/moss.webp) center/cover fixed}
html[data-skin="new"] body::before{content:"";position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 40%,rgba(5,25,10,.15),rgba(5,25,10,.6));pointer-events:none}
html[data-skin="new"] .app{position:relative;grid-template-rows:auto auto 1fr auto;gap:12px;padding:12px;height:100dvh}
html[data-skin="new"] .top{border:2px solid #c9a545;border-radius:18px;background:linear-gradient(180deg,rgba(8,40,18,.88),rgba(5,28,12,.9));box-shadow:0 12px 28px rgba(0,0,0,.45);padding:10px 14px}
html[data-skin="new"] .brand{display:flex;align-items:center;gap:10px}
html[data-skin="new"] .brand svg{width:34px;height:34px}
html[data-skin="new"] .top h1{font-size:1.6rem;color:#fff;font-weight:800;line-height:1.05}
html[data-skin="new"] .top h1 .sub{font-size:.82rem;color:#e8e0c2;font-family:"Playfair Display",Georgia,serif;font-weight:700;margin-top:2px}
html[data-skin="new"] .ribbon{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:700;letter-spacing:.12em;color:#fcde84;padding:5px 20px;border:1.5px solid #c9a545;border-radius:12px;
  background:linear-gradient(180deg,#123f1e,#0a2a12);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
html[data-skin="new"] .clock{font-family:"Playfair Display",Georgia,serif;font-weight:700;color:#fff;padding:6px 14px;border:1.5px solid #c9a545;border-radius:12px;background:rgba(5,30,14,.8);white-space:nowrap}
html[data-skin="new"] .wstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
html[data-skin="new"] .wst{--a:#14532a;--b:#0b3519;position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:12px;min-height:96px;padding:10px 16px;border-radius:16px;cursor:pointer;text-align:left;
  border:2px solid #c9a545;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);color:#fff}
html[data-skin="new"] .wst img{height:84px;width:auto;max-width:46%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));flex:none}
html[data-skin="new"] .wst .tx{margin-left:auto;padding-left:14px;border-left:1.5px solid rgba(252,222,132,.6);text-align:center}
html[data-skin="new"] .wst .tx span{display:block;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:1.25rem}
html[data-skin="new"] .wst .tx b{display:block;font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:2.6rem;line-height:1}
html[data-skin="new"] .wst.k-weak{--a:#a8781a;--b:#6b4a0c}
html[data-skin="new"] .wst.k-off{--a:#0f3b26;--b:#082418}
html[data-skin="new"] .wst[aria-pressed="true"]{box-shadow:0 0 0 3px #fcde84,0 10px 24px rgba(0,0,0,.45)}
html[data-skin="new"] .main{gap:12px;grid-template-columns:var(--panel) 1fr}
html[data-skin="new"] .side{border:2px solid #c9a545;border-radius:18px;overflow:hidden;background:rgba(8,36,16,.9);box-shadow:0 12px 28px rgba(0,0,0,.45)}
html[data-skin="new"] .main.nolist{grid-template-columns:1fr}
html[data-skin="new"] .main.nolist .side{display:none}
html[data-skin="new"] #map{border:3px solid #c9a545;border-radius:18px;overflow:hidden;box-shadow:0 14px 32px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.2)}
/* Selected bike panel: parchment */
html[data-skin="new"] .card{top:14px;right:14px;background:#f5eedb;color:#1d2a17;border:2px solid #c9a545;border-top:2px solid #c9a545;border-radius:18px;padding:0 0 14px;
  box-shadow:0 18px 40px rgba(0,0,0,.5)}
html[data-skin="new"] .card .sel-h{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#14532a,#0c3a1c);color:#fff;
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:1.2rem;padding:10px 54px 10px 16px;border-radius:14px;margin:8px}
html[data-skin="new"] .card .sel-h svg{width:22px;height:22px;color:#fcde84}
html[data-skin="new"] .card .x{top:14px;right:16px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:#fff}
html[data-skin="new"] .card .hd,html[data-skin="new"] .card .grid,html[data-skin="new"] .card .acts,html[data-skin="new"] .card .note{margin-left:16px;margin-right:16px}
html[data-skin="new"] .card .hd{padding-right:0;margin-top:10px;padding-bottom:12px;border-bottom:1px solid #d8ccab}
html[data-skin="new"] .card h2{color:#14240f;font-size:1.35rem}
html[data-skin="new"] .card .ds{color:#4d5a43}
html[data-skin="new"] .card .kv{background:#ebe2c8}
html[data-skin="new"] .card .kv .k{color:#6a6a4a}
html[data-skin="new"] .card .kv .v small,html[data-skin="new"] .card .dash,html[data-skin="new"] .card .note{color:#5e664f}
html[data-skin="new"] .card .act{background:#e8dfc3;border-color:#d0c39c;color:#1d2a17}
html[data-skin="new"] .card .act.primary{background:#14532a;border-color:#14532a;color:#fff}
html[data-skin="new"] .wnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
html[data-skin="new"] .wnav>*{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:14px;border:2px solid #c9a545;cursor:pointer;text-decoration:none;
  background:linear-gradient(180deg,#14532a,#0b3519);color:#fff;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:1.15rem;box-shadow:0 10px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15)}
html[data-skin="new"] .wnav svg{width:24px;height:24px;color:#fcde84}
html[data-skin="new"] .wnav [aria-pressed="true"]{background:linear-gradient(180deg,#2f8a3f,#1b6a2c)}
@media (max-width:1100px){ html[data-skin="new"] .ribbon,html[data-skin="new"] .clock{display:none} }
@media (max-width:760px){
  html[data-skin="new"] .app{padding:0;gap:0;grid-template-rows:auto 1fr auto}
  html[data-skin="new"] body{background:#0a2210}
  html[data-skin="new"] .top{border-radius:0;border-width:0 0 2px}
  html[data-skin="new"] .top h1{font-size:1.2rem}
  html[data-skin="new"] .top h1 .sub{display:none}
  html[data-skin="new"] .wstats{display:none}
  html[data-skin="new"] .main{grid-template-columns:1fr}
  html[data-skin="new"] #map{border-radius:0;border-width:0}
  html[data-skin="new"] .side{border-radius:18px 18px 0 0;border-width:2px 0 0}
  html[data-skin="new"] .main.nolist .side{display:flex}
  html[data-skin="new"] .wnav{gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:#082812;border-top:2px solid #c9a545}
  html[data-skin="new"] .wnav>*{flex-direction:column;gap:2px;font-size:.78rem;padding:7px 2px;border:0;box-shadow:none;background:transparent;font-family:Figtree,sans-serif;font-weight:800}
  html[data-skin="new"] .wnav [aria-pressed="true"]{background:#1b6a2c}
  html[data-skin="new"] .mobile-tog{display:none}
  html[data-skin="new"] .side{height:58%;bottom:0}
  html[data-skin="new"] .main{overflow:hidden}
  html[data-skin="new"] .side.collapsed{transform:translateY(105%)}
  html[data-skin="new"] .card{top:auto;bottom:0;left:0;right:0;width:auto;max-height:64%;border-radius:18px 18px 0 0;border-width:2px 0 0}
  html[data-skin="new"] .card .sel-h{font-size:1.05rem;padding:8px 50px 8px 14px}
  html[data-skin="new"] .card .x{top:12px}
  html[data-skin="new"] .card{bottom:0}
}

/* Classic design: the Control Room as it was before the redesign */
html:not([data-skin="new"]) .wstats,html:not([data-skin="new"]) .wnav,html:not([data-skin="new"]) .ribbon,html:not([data-skin="new"]) .clock,
html:not([data-skin="new"]) .brand svg,html:not([data-skin="new"]) .card .sel-h,html:not([data-skin="new"]) .t-new{display:none}
html[data-skin="new"] .t-classic{display:none}
[data-control-theme="aurora"]{
  --bg:#090d20;--surface:#151b31;--surface2:#202840;--line:#39435c;
  --text:#eff2ff;--muted:#bbc5da;--gold:#5ce4ef;--gold-light:#bbf5ff;
  --head-a:#12283d;--head-b:#30204d;
}
[data-control-theme="daylight"]{
  color-scheme:light;
  --bg:#f2f5fa;--surface:#fff;--surface2:#e9eef8;--line:#d5deec;
  --text:#141c31;--muted:#43516a;--gold:#075ba5;--gold-light:#095d79;
  --head-a:#ddf6f1;--head-b:#eae6fc;
}
html[data-control-theme] body{background:var(--bg)}
html[data-control-theme] body::before{display:none}
html[data-control-theme] :is(.top,.side,#map,.card,.wnav){border-color:var(--line)}
html[data-control-theme] .top{background:linear-gradient(110deg,var(--head-a),var(--head-b))}
html[data-control-theme] :is(.side,.card,.card .sel-h,.wnav,.leaflet-tooltip.tip){background:var(--surface);color:var(--text)}
html[data-control-theme] :is(.top h1,.top h1 .sub,.card h2,.card .ds,.card .sel-h svg,.card .dash,.card .note,.card .kv .k,.card .kv .v small,.wnav svg){color:var(--text);font-family:inherit}
html[data-control-theme] :is(.card .kv,.card .act,.wnav>*,.wst){background:var(--surface2);color:var(--text);border-color:var(--line)}
html[data-control-theme] :is(.back,.tbtn,.seg,.ribbon,.clock,.card .x){border-color:var(--line);background:var(--surface);color:var(--text)}
html[data-control-theme] :is(.seg button,.card .hd){border-color:var(--line)}
html[data-control-theme] :is(.seg button[aria-pressed="true"],.tbtn[aria-pressed="true"],.wnav [aria-pressed="true"],.card .act.primary){background:var(--gold);color:var(--bg)}
html[data-control-theme="daylight"] :is(.fresh,.fresh.stale,.fresh.demo){color:var(--text)}
html[data-control-theme="aurora"] .leaflet-tile-pane{filter:sepia(.18) hue-rotate(175deg) saturate(1.4)}

/* ---- journey: start, stops and last position, on the map and in the card ---- */
.jm{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2.5px solid #fff;color:#1a1400;font:900 12px Figtree,sans-serif;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.jm.s{background:#22c55e;color:#062b12}.jm.p{background:#f5b301}.jm.e{background:#ef4444;color:#fff}
.jpop b{display:block;font-size:13px;margin-bottom:2px}.jpop span{display:block;font-size:12px}.jpop i{display:block;font-style:normal;font-size:12px;margin-top:4px;opacity:.85}
.journey{margin-top:14px}
.journey h3{margin:0 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.journey ol{list-style:none;margin:0;padding:0;position:relative}
.journey ol::before{content:"";position:absolute;left:12px;top:14px;bottom:14px;width:2px;background:var(--line)}
.journey li{position:relative;display:grid;grid-template-columns:26px 1fr;gap:10px;padding:6px 0;cursor:pointer}
.journey li:hover .jt b{text-decoration:underline}
.journey .jt b{display:block;font-size:.88rem}
.journey .jt small{display:block;color:var(--muted);font-weight:600;font-size:.78rem}
.journey .jt em{display:block;font-style:normal;font-size:.82rem;margin-top:1px}
.journey .leg{grid-column:2;font-size:.74rem;color:var(--muted);font-weight:700;padding:0 0 2px}
.daypill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;background:#7c3aed;color:#fff;font-weight:800;font-size:.78rem;text-decoration:none}

/* grouped bubbles and photo pins */
.bub{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#1f6b45;color:#fff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,107,69,.25),0 3px 8px rgba(0,0,0,.35);cursor:pointer}
.bub b{font:900 15px Figtree,sans-serif}
.bub.has-moving{background:#16a34a;box-shadow:0 0 0 6px rgba(22,163,74,.3),0 3px 8px rgba(0,0,0,.35)}
.mk.face .dot{width:32px;height:32px;margin:-5px 0 0 -5px;border-width:3px;border-color:var(--k);overflow:hidden;background:#fff}
.mk.face .dot img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.mk.face .lab{left:32px}
/* bigger, calmer type on phones */
@media (max-width:760px){
  .row .nm{font-size:1rem}.row .mt{font-size:.84rem}.row .rt{font-size:.8rem}.av{width:42px;height:42px}
  .chip{padding:7px 12px;font-size:.84rem}.search input{font-size:1rem;padding:12px 14px}
  .card .kv .v{font-size:1.02rem}.card .kv .k{font-size:.72rem}
  .journey .jt b{font-size:.98rem}.journey .jt small{font-size:.86rem}.journey .jt em{font-size:.9rem}
  .mk .lab{font-size:12.5px}.mk .lab small{font-size:11.5px}
}
.personlink{display:block;margin:12px 16px 0;text-align:center;padding:11px;border-radius:12px;background:var(--gold);color:#1a1400;font-weight:900;text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="dashboard" title="Owner dashboard" aria-label="Owner dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
    <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#e0bb4b" d="M24 4c-6 6-9 12-9 18 0 5 3 9 8 10V44h2V32c5-1 8-5 8-10 0-6-3-12-9-18zm-1 25c-3-1-5-4-5-7 0-4 2-9 5-13z"/></svg>
      <h1><span class="t-new">DC Forest</span><span class="t-classic">Control Room</span> <span class="sub t-new" id="org2">Publicity &amp; Extension Division, Lahore</span><span class="sub t-classic">Who is where, right now</span></h1></div>
    <span class="ribbon">Living Wall</span>
    <span class="fresh" id="fresh"><i></i><span>Loading…</span></span>
    <span class="spacer"></span>
    <span class="clock" id="clock"></span>
    <button class="tbtn" id="trailsBtn" type="button" aria-pressed="false" title="Show everyone's route today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="6" r="2.5"/><path d="M7.5 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7.5"/></svg>
      <span>Routes today</span></button>
    <button class="tbtn" id="labelsBtn" type="button" aria-pressed="true" title="Show names on the map"><span>Names</span></button>
    <div class="seg" role="group" aria-label="Map style">
      <button type="button" data-base="match" aria-pressed="false">Match my theme</button>
      <button type="button" data-base="street" aria-pressed="true">Map</button>
      <button type="button" data-base="dark" aria-pressed="false" class="hide-sm">Dark</button>
      <button type="button" data-base="sat" aria-pressed="false">Satellite</button>
    </div>
  </header>

  <div class="wstats" id="wstats" aria-label="Fleet summary"></div>
  <div class="main">
    <aside class="side" id="side" aria-label="Staff list">
      <button class="mobile-tog" id="sideTog" type="button" aria-expanded="true"><span id="sideTogTxt">People</span></button>
      <div class="search">
        <input id="q" type="search" placeholder="Search name, post, bike, area…" autocomplete="off" aria-label="Search">
        <div class="chips" id="chips"></div>
      </div>
      <div class="list" id="list" role="list"></div>
    </aside>
    <div id="map" aria-label="Map"></div>
    <section class="card" id="card" hidden aria-live="polite"></section>
  </div>
  <nav class="wnav" aria-label="Sections">
    <button type="button" id="navFleet" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 9 9h5l4.5 7.5M9 9 7.5 6H5M14 9l1.5-3H18"/></svg>Fleet</button>
    <button type="button" id="navMap" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Map</button>
    <a href="dashboard#staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-6 6.5-6s5.9 2.4 6.5 6"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.9-.2 5 1.8 5.5 4.8"/></svg>Staff</a>
    <a href="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Dashboard</a>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  'use strict';
  var STATES = {
    moving:{lb:'Moving', k:'var(--moving)', c:'#4ade80'},
    idle:  {lb:'Idle',   k:'var(--idle)',   c:'#ff7a2f'},
    stop:  {lb:'Stopped',k:'var(--stop)',   c:'#5b7fb3'},
    none:  {lb:'Offline',k:'var(--none)',   c:'#b6bdc8'}
  };
  var mapThemes = {
    forest: {base:'street', colors:['#22c55e','#f59e0b','#5b7fb3','#b6bdc8'], route:'#e0bb4b'},
    aurora: {base:'dark', colors:['#53efac','#ffb15c','#8fb3ff','#8b95a8'], route:'#55e7ff'},
    daylight: {base:'street', colors:['#16a34a','#d97706','#4f6d9a','#a3aab5'], route:'#075db0'}
  };
  var DUTY = {active:'Active', field:'On field duty', leave:'On leave', absent:'Absent', suspended:'Suspended', parked:'Pool', inuse:'In use', vacant:'Vacant'};
  var BIKE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 9 9h5l4.5 7.5M9 9 7.5 6H5"/></svg>';
  var FLEET_MS = 60*1000, TRAIL_MS = 5*60*1000, STALE_MS = 15*60*1000;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function initials(n){ return String(n||'?').replace(/^(Mr|Mrs|Ms|Dr)\.?\s+/i,'').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase() || '?'; }
  function short(n){ return String(n||'').replace(/^(Mr|Mrs|Ms|Dr)\.?\s+/i,''); }
  function ago(iso){
    if(!iso) return null;
    var s = (Date.now() - Date.parse(iso))/1000;
    if(s < 90) return 'just now';
    if(s < 3600) return Math.round(s/60) + ' min ago';
    if(s < 86400) return Math.round(s/3600) + ' h ago';
    return Math.round(s/86400) + ' days ago';
  }
  function clock(iso){ try{ return new Date(iso).toLocaleString('en-GB',{timeZone:'Asia/Karachi',day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true}); }catch(e){ return iso; } }
  function dash(v, unit){ return v === null || v === undefined ? '<span class="dash">—</span>' : esc(v) + (unit ? ' <small>'+unit+'</small>' : ''); }
  function waNumber(c){ var d = String(c||'').replace(/\D/g,''); if(/^03\d{9}$/.test(d)) return '92' + d.slice(1); if(/^923\d{9}$/.test(d)) return d; return null; }

  /* ---------- roster (from the daily data block in the main page) ---------- */
  var roster = {}, PHOTOS = {};
  fetch('staff/photos.json', {cache:'no-store', credentials:'same-origin'}).then(function(r){ return r.ok ? r.json() : {}; }).then(function(j){ PHOTOS = j || {}; if(vehicles.length){ drawList(); if(selected){ var v = vehicles.find(function(x){ return x.reg === selected; }); if(v) drawCard(v); } } }).catch(function(){});
  function face(reg, cls){ var r = roster[reg], n = r && r.name ? short(r.name) : null, f = n && PHOTOS[n];
    return f ? '<img class="'+(cls||'')+'" src="staff/'+esc(f)+'" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 15%">' : esc(initials(who(reg))); }                       // reg -> {name, designation, section, status, contact, area, unit, vehicleType, model}
  function loadRoster(){
    return fetch('classic', {cache:'no-store', credentials:'same-origin'}).then(function(r){ return r.text(); }).then(function(html){
      var m = /<script id="data" type="application\/json">([\s\S]*?)<\/script>/.exec(html);
      if(!m) return;
      var d = JSON.parse(m[1]);
      (d.sections||[]).forEach(function(s){ (s.rows||[]).forEach(function(r){
        if(r.vehicle && !roster[r.vehicle]) roster[r.vehicle] = {name:r.name, designation:r.designation, section:s.label, status:r.status, contact:r.contact,
          area:r.area, unit:r.unit, vehicleType:r.vehicleType, model:r.model, remarks:r.remarks};
      }); });
    }).catch(function(){});
  }
  function who(reg){ var r = roster[reg]; return r && r.name ? short(r.name) : (r && r.status === 'parked' ? 'Pool bike' : 'Unassigned'); }

  /* ---------- map ---------- */
  var map = L.map('map', {zoomControl:true, preferCanvas:false}).setView([31.52, 74.35], 11);
  var ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
  function esri(path, extra){ return L.tileLayer(ESRI + path + '/MapServer/tile/{z}/{y}/{x}', Object.assign({maxZoom:19, maxNativeZoom:18, attribution:'Tiles &copy; Esri'}, extra||{})); }
  var BASES = {
    street: esri('World_Street_Map'),
    dark:   L.layerGroup([esri('Canvas/World_Dark_Gray_Base', {maxNativeZoom:16}), esri('Canvas/World_Dark_Gray_Reference', {maxNativeZoom:16})]),
    sat:    L.layerGroup([esri('World_Imagery'), esri('Reference/World_Boundaries_and_Places')])
  };
  var baseChoice = 'match', dashboardTheme = 'forest', activeBase, mapTheme;
  try{
    baseChoice = localStorage.getItem('crBase') || 'match';
    dashboardTheme = localStorage.getItem('dcforest-dashboard-theme') || 'daylight';
  }catch(e){}
  if(!Object.hasOwn(BASES, baseChoice) && baseChoice !== 'match') baseChoice = 'match';
  if(!Object.hasOwn(mapThemes, dashboardTheme)) dashboardTheme = 'daylight';
  var baseButtons = document.querySelectorAll('[data-base]');
  function applyMapStyle(){
    var matchedTheme = baseChoice === 'match' ? dashboardTheme : 'forest';
    mapTheme = mapThemes[matchedTheme];
    if(matchedTheme === 'forest') delete document.documentElement.dataset.controlTheme;
    else document.documentElement.dataset.controlTheme = matchedTheme;
    ['moving','idle','stop','none'].forEach(function(state, index){
      STATES[state].c = mapTheme.colors[index];
      document.documentElement.style.setProperty('--'+state, mapTheme.colors[index]);
    });
    var nextBase = baseChoice === 'match' ? mapTheme.base : baseChoice;
    if(activeBase !== nextBase){
      if(activeBase) map.removeLayer(BASES[activeBase]);
      BASES[nextBase].addTo(map);
      activeBase = nextBase;
    }
    baseButtons.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.base === baseChoice); });
  }
  applyMapStyle();
  baseButtons.forEach(function(b){
    b.addEventListener('click', function(){
      baseChoice = b.dataset.base;
      try{ localStorage.setItem('crBase', baseChoice); }catch(e){}
      refreshMapStyle();
    });
  });
  window.addEventListener('storage', function(e){
    if(e.key !== 'dcforest-dashboard-theme') return;
    dashboardTheme = Object.hasOwn(mapThemes, e.newValue) ? e.newValue : 'daylight';
    if(baseChoice === 'match') refreshMapStyle();
  });
  function refreshMapStyle(){
    applyMapStyle();
    drawList();
    drawMarkers();
    drawTrails();
    var bike = vehicles.find(function(v){ return v.reg === selected; });
    if(bike) drawCard(bike);
  }

  var vehicles = [], markers = {}, selected = null, filter = '', term = '', fitted = false;
  var trailLayer = L.layerGroup().addTo(map), trailData = null, showTrails = false, showLabels = true;
  /* Which day's routes and stops to show: today, or ?date=YYYY-MM-DD from the activity log. */
  var todayPk = new Date(Date.now() + 5*3600000).toISOString().slice(0,10);
  var viewDate = (function(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d || '') && d <= todayPk ? d : todayPk; })(new URLSearchParams(location.search).get('date'));
  var isToday = viewDate === todayPk, actData = null, jMarkers = [], wantAt = +(new URLSearchParams(location.search).get('at') || 0);
  if(!isToday){
    var dp = document.createElement('a'); dp.className = 'daypill'; dp.href = 'control' + (new URLSearchParams(location.search).get('reg') ? '?reg=' + encodeURIComponent(new URLSearchParams(location.search).get('reg')) : '');
    dp.textContent = 'Showing ' + new Date(viewDate + 'T12:00:00Z').toLocaleDateString('en-GB', {day:'numeric', month:'short'}) + ' · back to today';
    var fr = document.getElementById('fresh'); fr.parentNode.insertBefore(dp, fr.nextSibling);
  }

  /* Street address for a point: asked from the server (owner-only, cached), remembered on this device. */
  var placeMem = {}, placeQ = Promise.resolve();
  function placeOf(lat, lon){
    var k = lat.toFixed(3) + ',' + lon.toFixed(3);
    if(placeMem[k]) return placeMem[k];
    try{ var c = localStorage.getItem('place:' + k); if(c) return (placeMem[k] = Promise.resolve(c)); }catch(e){}
    return (placeMem[k] = placeQ = placeQ.then(function(){
      return fetch('api/place.json?lat=' + lat + '&lon=' + lon, {credentials:'same-origin'}).then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){ var p = j && j.place; if(p){ try{ localStorage.setItem('place:' + k, p); }catch(e){} } return p || (lat.toFixed(5) + ', ' + lon.toFixed(5)); })
        .catch(function(){ return lat.toFixed(5) + ', ' + lon.toFixed(5); });
    }));
  }
  function tShort(sec){ return new Date(sec*1000).toLocaleTimeString('en-US', {timeZone:'Asia/Karachi', hour:'numeric', minute:'2-digit'}); }
  function dur(min){ var h = Math.floor(min/60), m = min % 60; return h ? h + ' h ' + (m ? m + ' m' : '') : m + ' min'; }

  /* The day as a list: where they started, each stop of 10+ minutes, and where they were last. */
  function journey(reg){
    var pts = trailData && trailData.vehicles ? (trailData.vehicles[reg] || []) : [], s = actData && actData.vehicles ? actData.vehicles[reg] : null;
    if(!pts.length) return [];
    var first = pts[0], last = pts[pts.length-1], items = [], stops = (s && s.stops) || [];
    if(!stops.length || stops[0].from > first[0]) items.push({kind:'s', lat:first[1], lon:first[2], t:'Started', when:tShort(first[0]) + (s && s.firstMove != null && s.firstMove > first[0] ? ', moving from ' + tShort(s.firstMove) : '')});
    stops.forEach(function(st, i){
      var atStart = st.from <= first[0], atEnd = st.to >= last[0];
      items.push({kind: atStart ? 's' : 'p', lat:st.lat, lon:st.lon, from:st.from, to:st.to,
        t: atStart ? 'Started here' : 'Stop ' + (items.filter(function(x){ return x.kind === 'p'; }).length + 1),
        when: atStart ? 'Here until ' + tShort(st.to) + ' (' + dur(st.min) + ')' : tShort(st.from) + ' – ' + (atEnd ? 'still here at ' + tShort(st.to) : tShort(st.to)) + ' (' + dur(st.min) + ')'});
    });
    var lastStop = stops[stops.length-1];
    if(!lastStop || lastStop.to < last[0]) items.push({kind:'e', lat:last[1], lon:last[2], t: isToday ? 'Last position' : 'Day ended here', when:'Last report ' + tShort(last[0])});
    else items[items.length-1].kind = items[items.length-1].kind === 's' ? 's' : 'e';
    return items;
  }
  function drawJourney(reg){
    jMarkers = [];
    var items = journey(reg), n = 0;
    items.forEach(function(it, i){
      var label = it.kind === 's' ? 'S' : it.kind === 'e' && !it.from ? '●' : String(++n);
      if(it.kind === 'e' && it.from) label = String(++n);
      var m = L.marker([it.lat, it.lon], {icon:L.divIcon({className:'', iconSize:[26,26], iconAnchor:[13,13], html:'<div class="jm '+(it.kind === 'p' || (it.kind === 'e' && it.from) ? 'p' : it.kind)+'">'+label+'</div>'}), zIndexOffset:2000})
        .bindPopup('<div class="jpop"><b>'+esc(it.t)+'</b><span>'+esc(it.when)+'</span><i>Finding the address…</i></div>', {className:'jpopw'}).addTo(trailLayer);
      m.on('popupopen', function(){ placeOf(it.lat, it.lon).then(function(p){ m.setPopupContent('<div class="jpop"><b>'+esc(it.t)+'</b><span>'+esc(it.when)+'</span><i>'+esc(p)+'</i></div>'); }); });
      it.label = label; jMarkers[i] = m;
    });
    return items;
  }
  function openStop(i){
    var m = jMarkers[i]; if(!m) return;
    var ll = m.getLatLng(); focusOn({lat:ll.lat, lon:ll.lng}, Math.max(map.getZoom(), 16)); setTimeout(function(){ m.openPopup(); }, 650);
  }
  function loadActivity(){
    return fetch('api/activity.json?date=' + viewDate, {cache:'no-store', credentials:'same-origin'}).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ actData = j; }).catch(function(){});
  }

  function photoOf(reg){ var r = roster[reg], n = r && r.name ? short(r.name) : null; return n && PHOTOS[n] ? 'staff/' + PHOTOS[n] : null; }
  function iconFor(v){
    var st = STATES[v.state] || STATES.none, r = roster[v.reg];
    var sub = v.state === 'moving' && v.speed !== null ? Math.round(v.speed) + ' km/h' : st.lb + (v.state === 'none' && v.reportedAt ? ' · ' + ago(v.reportedAt) : '');
    return L.divIcon({className:'', iconSize:[22,22], iconAnchor:[11,11],
      html:'<div class="mk '+v.state+(selected===v.reg?' sel':'')+(showLabels?'':' hide-lab')+(photoOf(v.reg)?' face':'')+'" style="--k:'+st.c+'"><div class="dot">'+(photoOf(v.reg) ? '<img src="'+esc(photoOf(v.reg))+'" alt="">' : BIKE)+'</div>'+
        '<div class="lab">'+esc(who(v.reg))+'<small>'+esc(v.reg)+' · '+esc(sub)+'</small></div></div>'});
  }
  function tipFor(v){
    var r = roster[v.reg] || {}, st = STATES[v.state] || STATES.none;
    return '<b>'+esc(who(v.reg))+'</b>'+(r.designation?' · '+esc(r.designation):'')+'<br>'+esc(v.reg)+' — '+st.lb+
      (v.speed!==null && v.state==='moving' ? ', '+Math.round(v.speed)+' km/h' : '')+'<br>Last report: '+esc(ago(v.reportedAt) || '—');
  }

  function drawMarkers(){
    var seen = {};
    vehicles.forEach(function(v){
      seen[v.reg] = 1;
      if(v.lat === null || v.lon === null){ if(markers[v.reg]){ map.removeLayer(markers[v.reg]); delete markers[v.reg]; } return; }
      var m = markers[v.reg];
      if(!m){
        m = markers[v.reg] = L.marker([v.lat, v.lon], {icon:iconFor(v), riseOnHover:true, keyboard:true, title:who(v.reg)+' '+v.reg})
          .on('click', function(){ select(v.reg, false); }).addTo(map);
        m.bindTooltip('', {className:'tip', direction:'top', offset:[0,-12]});
      } else { m.setLatLng([v.lat, v.lon]); m.setIcon(iconFor(v)); }
      m.setTooltipContent(tipFor(v));
      m.setZIndexOffset(selected === v.reg ? 1000 : v.state === 'moving' ? 500 : v.state === 'none' ? -500 : 0);
      m.getElement() && (m.getElement().style.display = matches(v) ? '' : 'none');
    });
    Object.keys(markers).forEach(function(k){ if(!seen[k]){ map.removeLayer(markers[k]); delete markers[k]; } });
    cluster();
    declutter();
    if(!fitted){
      var pts = vehicles.filter(function(v){ return v.lat !== null; }).map(function(v){ return [v.lat, v.lon]; });
      if(pts.length){ map.fitBounds(pts, {padding:[40,40], maxZoom:14}); fitted = true; }
    }
  }

  /* Bikes that sit within ~34 px of each other on screen become one bubble ("5 here"). Tapping a bubble
     zooms in; at street level it lists them. The selected person is never hidden in a bubble. */
  var bubbles = L.layerGroup().addTo(map), CL_PX = 34;
  function cluster(){
    bubbles.clearLayers();
    var items = vehicles.filter(function(v){ return markers[v.reg] && matches(v); }).map(function(v){
      var el = markers[v.reg].getElement(); if(el) el.style.visibility = '';
      return {v:v, p:map.latLngToLayerPoint([v.lat, v.lon])}; });
    var used = {}, groups = [];
    items.forEach(function(a){
      if(used[a.v.reg] || a.v.reg === selected) return;
      var g = [a]; used[a.v.reg] = 1;
      items.forEach(function(b){ if(!used[b.v.reg] && b.v.reg !== selected && a.p.distanceTo(b.p) < CL_PX){ g.push(b); used[b.v.reg] = 1; } });
      if(g.length > 1) groups.push(g);
    });
    groups.forEach(function(g){
      g.forEach(function(x){ var el = markers[x.v.reg].getElement(); if(el) el.style.visibility = 'hidden'; });
      var lat = 0, lon = 0, mov = 0; g.forEach(function(x){ lat += x.v.lat; lon += x.v.lon; if(x.v.state === 'moving') mov++; }); lat /= g.length; lon /= g.length;
      var near = g.map(function(x){ return x.v; });
      var b = L.marker([lat, lon], {zIndexOffset:800, icon:L.divIcon({className:'', iconSize:[40,40], iconAnchor:[20,20],
        html:'<div class="bub'+(mov ? ' has-moving' : '')+'"><b>'+g.length+'</b></div>'})}).addTo(bubbles);
      b.bindTooltip(g.length + ' bikes here' + (mov ? ' · ' + mov + ' moving' : '') + '<br><small>' + near.slice(0, 6).map(function(v){ return esc(who(v.reg)); }).join(', ') + (near.length > 6 ? '…' : '') + '</small>', {className:'tip', direction:'top', offset:[0,-18]});
      b.on('click', function(){
        if(map.getZoom() < 17){ map.flyToBounds(L.latLngBounds(near.map(function(v){ return [v.lat, v.lon]; })).pad(0.6), {maxZoom:18, duration:.5}); return; }
        // street level and still together: show them as a list to pick from
        L.popup({className:'jpopw', offset:[0,-14]}).setLatLng([lat, lon]).setContent('<div class="jpop"><b>'+g.length+' bikes here</b>'+near.map(function(v){
          return '<a href="#" data-pick="'+esc(v.reg)+'" style="display:block;padding:4px 0;font-weight:700;text-decoration:none">'+esc(who(v.reg))+' <small style="opacity:.7">'+esc(v.reg)+' · '+(STATES[v.state]||STATES.none).lb+'</small></a>'; }).join('')+'</div>').openOn(map);
      });
    });
  }
  document.addEventListener('click', function(e){ var a = e.target.closest('[data-pick]'); if(!a) return; e.preventDefault(); map.closePopup(); select(a.getAttribute('data-pick'), true); });
  map.on('zoomend', function(){ cluster(); declutter(); });

  /* Hide labels that would overlap one already shown, so the map stays readable; the selected
     person and moving vehicles get first claim on space. */
  function declutter(){
    if(!showLabels) return;
    var order = vehicles.filter(function(v){ return markers[v.reg] && matches(v); }).sort(function(a,b){
      function p(v){ return v.reg === selected ? 0 : v.state === 'moving' ? 1 : v.state === 'idle' ? 2 : v.state === 'stop' ? 3 : 4; }
      return p(a) - p(b);
    });
    var taken = [];
    order.forEach(function(v){
      var el = markers[v.reg].getElement(); if(!el || el.style.visibility === 'hidden') return;
      var mk = el.querySelector('.mk'); mk.classList.remove('hide-lab');
      var lab = mk.querySelector('.lab'), r = lab.getBoundingClientRect(), dot = mk.querySelector('.dot').getBoundingClientRect();
      var box = {l:Math.min(r.left,dot.left)-2, t:Math.min(r.top,dot.top)-2, r:r.right+2, b:Math.max(r.bottom,dot.bottom)+2};
      var hit = taken.some(function(o){ return !(box.r < o.l || box.l > o.r || box.b < o.t || box.t > o.b); });
      if(hit && v.reg !== selected) mk.classList.add('hide-lab'); else taken.push(box);
    });
  }
  map.on('zoomend moveend', declutter);

  /* ---------- list ---------- */
  var chipsEl = document.getElementById('chips'), listEl = document.getElementById('list'), qEl = document.getElementById('q');
  function hay(v){
    var r = roster[v.reg] || {};
    return [v.reg, v.reg.replace('-',''), who(v.reg), r.designation, r.section, r.area, r.unit, r.contact, r.remarks, (STATES[v.state]||STATES.none).lb, DUTY[r.status]].join(' ').toLowerCase();
  }
  function matches(v){
    if(filter && (filter === 'weak' ? v.signal !== 'weak' : v.state !== filter)) return false;
    if(!term) return true;
    var h = hay(v); return term.split(/\s+/).every(function(w){ return h.indexOf(w) > -1; });
  }
  function drawChips(){
    var defs = [{f:'',lb:'All',c:'#e0bb4b'},{f:'moving',lb:'Moving',c:STATES.moving.c},{f:'idle',lb:'Idle',c:STATES.idle.c},{f:'stop',lb:'Stopped',c:STATES.stop.c},{f:'none',lb:'Offline',c:STATES.none.c},{f:'weak',lb:'Weak signal',c:'#fb7185'}];
    chipsEl.innerHTML = defs.map(function(d){
      var n = vehicles.filter(function(v){ return !d.f || (d.f==='weak' ? v.signal==='weak' : v.state===d.f); }).length;
      return '<button type="button" class="chip" style="--k:'+d.c+'" data-f="'+d.f+'" aria-pressed="'+(filter===d.f)+'"><i></i>'+d.lb+' <b>'+n+'</b></button>';
    }).join('');
  }
  function drawList(){
    var order = {moving:0, idle:1, stop:2, none:3};
    var rows = vehicles.filter(matches).sort(function(a,b){ return (order[a.state]-order[b.state]) || who(a.reg).localeCompare(who(b.reg)); });
    listEl.innerHTML = rows.length ? rows.map(function(v){
      var r = roster[v.reg] || {}, st = STATES[v.state] || STATES.none;
      var right = v.state === 'moving' && v.speed !== null ? Math.round(v.speed)+' km/h' : (ago(v.reportedAt) || '');
      return '<button type="button" class="row" role="listitem" data-reg="'+esc(v.reg)+'" aria-current="'+(selected===v.reg)+'" style="--k:'+st.c+'">'+
        '<span class="av">'+face(v.reg)+'</span>'+
        '<span style="min-width:0"><div class="nm">'+esc(who(v.reg))+'</div><div class="mt">'+esc([r.designation, v.reg].filter(Boolean).join(' · '))+'</div></span>'+
        '<span class="rt"><span class="pill">'+st.lb+'</span><br>'+esc(right)+(v.lat===null?'<br>no location':'')+'</span></button>';
    }).join('') : '<div class="empty">Nobody matches.</div>';
    document.getElementById('sideTogTxt').textContent = 'People · ' + rows.length;
  }
  chipsEl.addEventListener('click', function(e){ var b = e.target.closest('.chip'); if(!b) return; filter = b.getAttribute('data-f'); refreshViews(); });
  qEl.addEventListener('input', function(){ term = qEl.value.trim().toLowerCase(); refreshViews(); });
  listEl.addEventListener('click', function(e){ var b = e.target.closest('.row'); if(b) select(b.getAttribute('data-reg'), true); });
  function refreshViews(){ drawChips(); drawList(); drawMarkers(); drawWall(); }

  /* Living Wall stat cards (computer): click to filter the map and list */
  function drawWall(){
    var S = (fleetMeta && fleetMeta.summary) || {};
    var defs = [{k:'total',f:'',lb:'All bikes',n:S.total,img:'bike'},{k:'moving',f:'moving',lb:'Moving',n:S.moving,img:'rider'},
                {k:'weak',f:'weak',lb:'Weak GSM',n:S.weakGsm,img:'tower'},{k:'off',f:'none',lb:'Offline',n:S.offline,img:'tracker'}];
    document.getElementById('wstats').innerHTML = defs.map(function(d){
      return '<button type="button" class="wst k-'+d.k+'" data-f="'+d.f+'" aria-pressed="'+(!!d.f && filter===d.f)+'"><img src="assets/v2/'+d.img+'.webp" alt="">'+
        '<span class="tx"><span>'+d.lb+'</span><b>'+(typeof d.n === 'number' ? d.n : '—')+'</b></span></button>';
    }).join('');
  }
  document.getElementById('wstats').addEventListener('click', function(e){ var b = e.target.closest('.wst'); if(!b) return; var f = b.getAttribute('data-f'); filter = filter === f ? '' : f; refreshViews(); });

  /* bottom navigation: Fleet shows/hides the list, Map shows the whole fleet */
  var sideEl = document.getElementById('side'), mainEl = document.querySelector('.main'), navFleet = document.getElementById('navFleet'), navMap = document.getElementById('navMap');
  var phoneMQ = window.matchMedia('(max-width:760px)');
  function setList(open){
    if(phoneMQ.matches){ sideEl.classList.toggle('collapsed', !open); }
    else { mainEl.classList.toggle('nolist', !open); setTimeout(function(){ map.invalidateSize(); declutter(); }, 50); }
    navFleet.setAttribute('aria-pressed', open); navMap.setAttribute('aria-pressed', !open);
  }
  navFleet.addEventListener('click', function(){ setList(navFleet.getAttribute('aria-pressed') !== 'true'); });
  navMap.addEventListener('click', function(){
    setList(false);
    var pts = vehicles.filter(function(v){ return v.lat !== null && matches(v); }).map(function(v){ return [v.lat, v.lon]; });
    if(pts.length) map.fitBounds(pts, {padding:[40,40], maxZoom:14});
  });
  function tickClock(){ try{ document.getElementById('clock').textContent = new Date().toLocaleString('en-GB',{timeZone:'Asia/Karachi',day:'numeric',month:'short',year:'numeric'}) + ' · ' +
    new Date().toLocaleTimeString('en-US',{timeZone:'Asia/Karachi',hour:'numeric',minute:'2-digit'}); }catch(e){} }
  tickClock(); setInterval(tickClock, 30000);
  setList(!phoneMQ.matches);

  var side = document.getElementById('side'), sideTog = document.getElementById('sideTog');
  sideTog.addEventListener('click', function(){ var c = side.classList.toggle('collapsed'); sideTog.setAttribute('aria-expanded', !c); });

  /* ---------- person card ---------- */
  var card = document.getElementById('card');
  function select(reg, fly){
    selected = reg;
    var v = vehicles.find(function(x){ return x.reg === reg; });
    if(!v){ card.hidden = true; return; }
    var phone = window.matchMedia('(max-width:760px)').matches;
    if(phone){ side.classList.add('collapsed'); sideTog.setAttribute('aria-expanded','false');
      document.getElementById('navFleet').setAttribute('aria-pressed','false'); document.getElementById('navMap').setAttribute('aria-pressed','true'); }
    drawCard(v); drawList(); drawMarkers(); drawTrails();
    if(v.lat !== null && (fly || phone)) focusOn(v, fly ? Math.max(map.getZoom(), 15) : map.getZoom());
  }
  /* Centre a bike in the part of the map the card does not cover (above it on a phone, left of it on a computer). */
  function focusOn(v, zoom){
    var size = map.getSize(), r = card.getBoundingClientRect(), m = document.getElementById('map').getBoundingClientRect();
    var phone = window.matchMedia('(max-width:760px)').matches;
    var dx = phone || card.hidden ? 0 : -(m.right - r.left) / 2;
    var dy = phone && !card.hidden ? -(m.bottom - r.top) / 2 : 0;
    var pt = map.project([v.lat, v.lon], zoom).subtract([dx, dy]);
    map.flyTo(map.unproject(pt, zoom), zoom, {duration:.6});
  }
  function drawCard(v){
    var r = roster[v.reg] || {}, st = STATES[v.state] || STATES.none;
    var km = trailData && trailData.km ? trailData.km[v.reg] : null, pts = trailData && trailData.vehicles ? (trailData.vehicles[v.reg]||[]) : [];
    var wa = waNumber(r.contact), sig = {strong:'Strong', low:'Low', weak:'Weak', none:'—'}[v.signal] || null;
    var ign = v.ignition === 'on' ? 'On' : v.ignition === 'off' ? 'Off' : null;
    card.style.setProperty('--k', st.c);
    card.innerHTML =
      '<div class="sel-h">Selected bike<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3C11 3 5 8 5 15c0 1.3.3 2.4.8 3.4M5.8 18.4C8 12 12 9 16 7"/></svg></div>'+
      '<button class="x" type="button" aria-label="Close">×</button>'+
      '<div class="hd"><span class="av" style="--k:'+st.c+'">'+face(v.reg)+'</span><div><h2>'+esc(r.name || who(v.reg))+'</h2>'+
        '<div class="ds">'+esc([r.designation, r.section].filter(Boolean).join(' · ') || 'Not on the staff list')+'</div></div></div>'+
      '<div class="grid">'+
        '<div class="kv"><div class="k">Now</div><div class="v"><span class="pill" style="--k:'+st.c+'">'+st.lb+'</span></div></div>'+
        '<div class="kv"><div class="k">Speed</div><div class="v">'+(v.state==='none' ? '<span class="dash">—</span>' : dash(v.speed===null?null:Math.round(v.speed),'km/h'))+'</div></div>'+
        '<div class="kv"><div class="k">Last report</div><div class="v">'+dash(ago(v.reportedAt))+'<br><small>'+esc(v.reportedAt ? clock(v.reportedAt) : '')+'</small></div></div>'+
        '<div class="kv"><div class="k">Today</div><div class="v">'+dash(km,'km')+'<br><small>'+pts.length+(pts.length===1?' report':' reports')+'</small></div></div>'+
        '<div class="kv"><div class="k">Engine</div><div class="v">'+dash(v.state==='none'?null:ign)+'</div></div>'+
        '<div class="kv"><div class="k">Signal</div><div class="v">'+dash(v.state==='none'?null:sig)+'</div></div>'+
        '<div class="kv wide"><div class="k">Bike</div><div class="v">'+esc(v.reg)+' <small>'+esc([r.vehicleType, r.model].filter(Boolean).join(' '))+'</small></div></div>'+
        (r.status ? '<div class="kv"><div class="k">Duty today</div><div class="v">'+esc(DUTY[r.status]||r.status)+'</div></div>' : '')+
        (r.area || r.unit ? '<div class="kv"><div class="k">Posted at</div><div class="v" style="font-size:.85rem">'+esc([r.unit, r.area].filter(Boolean).join(', '))+'</div></div>' : '')+
        (r.remarks ? '<div class="kv wide"><div class="k">Remarks</div><div class="v" style="font-size:.85rem;font-weight:600">'+esc(r.remarks)+'</div></div>' : '')+
      '</div>'+
      '<div class="acts">'+
        (r.contact ? '<a class="act primary" href="tel:'+esc(String(r.contact).replace(/[^\d+]/g,''))+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>Call '+esc(r.contact)+'</a>' : '')+
        (wa ? '<a class="act" href="https://wa.me/'+wa+'" target="_blank" rel="noopener">WhatsApp</a>' : '')+
        (v.lat !== null ? '<a class="act" href="https://www.google.com/maps/dir/?api=1&destination='+v.lat+','+v.lon+'" target="_blank" rel="noopener">Directions</a>' : '')+
        (v.lat !== null ? '<button class="act" type="button" data-center>Show on map</button>' : '')+
      '</div>'+
      '<a class="personlink" href="person?reg='+encodeURIComponent(v.reg)+(isToday ? '' : '&date='+viewDate)+'">Open full profile →</a>'+
      journeyHtml(v.reg)+
      '<p class="note">'+(v.lat === null ? 'This tracker has not sent a usable location. ' : 'Location is the tracker’s last report. ')+
        (pts.length > 1 ? (isToday ? 'Today’s' : 'This day’s') + ' route is drawn on the map; tap a numbered stop for its time and address.' : 'No route for ' + (isToday ? 'today' : 'this day') + ' yet.')+
        (v.state === 'moving' && v.reportedAt && Date.now() - Date.parse(v.reportedAt) > 3600000 ? ' Note: the portal still counts this bike as moving, but its last report is old.' : '')+'</p>';
    card.hidden = false;
    fillJourney(card);
    card.querySelector('.x').onclick = function(){ selected = null; card.hidden = true; drawList(); drawMarkers(); drawTrails(); };
    var c = card.querySelector('[data-center]'); if(c) c.onclick = function(){ focusOn(v, 16); };
  }
  function journeyHtml(reg){
    var items = journey(reg); if(!items.length) return '';
    var n = 0;
    return '<div class="journey"><h3>'+(isToday ? 'Today’s stops' : 'Stops on ' + new Date(viewDate + 'T12:00:00Z').toLocaleDateString('en-GB', {day:'numeric', month:'short'}))+'</h3><ol>'+
      items.map(function(it, i){
        var lab = it.kind === 's' ? 'S' : it.kind === 'e' && !it.from ? '●' : String(++n), cls = it.kind === 'p' || (it.kind === 'e' && it.from) ? 'p' : it.kind;
        return '<li data-j="'+i+'"><span class="jm '+cls+'">'+lab+'</span><span class="jt"><b>'+esc(it.t)+'</b><small>'+esc(it.when)+'</small><em data-addr="'+it.lat+','+it.lon+'">…</em></span></li>';
      }).join('')+'</ol></div>';
  }
  function fillJourney(root){
    root.querySelectorAll('[data-addr]').forEach(function(el){ var p = el.getAttribute('data-addr').split(','); placeOf(+p[0], +p[1]).then(function(a){ el.textContent = a; }); });
    root.querySelectorAll('[data-j]').forEach(function(li){ li.onclick = function(){ openStop(+li.getAttribute('data-j')); }; });
  }
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !card.hidden){ card.querySelector('.x').click(); } });

  /* ---------- routes today ---------- */
  function drawTrails(){
    trailLayer.clearLayers();
    if(!trailData || !trailData.vehicles) return;
    Object.keys(trailData.vehicles).forEach(function(reg){
      if(!(showTrails || reg === selected)) return;
      var v = vehicles.find(function(x){ return x.reg === reg; }); if(v && !matches(v) && reg !== selected) return;
      var pts = trailData.vehicles[reg]; if(!pts || pts.length < 2) return;   // stops are drawn separately by drawJourney
      var st = STATES[(v && v.state) || 'none'], ll = pts.map(function(p){ return [p[1], p[2]]; }), sel = reg === selected;
      L.polyline(ll, {color: sel ? mapTheme.route : st.c, weight: sel ? 5 : 3, opacity: sel ? .95 : .55}).addTo(trailLayer);
    });
    if(selected) drawJourney(selected);
  }
  document.getElementById('trailsBtn').addEventListener('click', function(){
    showTrails = !showTrails; this.setAttribute('aria-pressed', showTrails); drawTrails();
  });
  document.getElementById('labelsBtn').addEventListener('click', function(){
    showLabels = !showLabels; this.setAttribute('aria-pressed', showLabels); drawMarkers();
  });

  /* ---------- data ---------- */
  var freshEl = document.getElementById('fresh'), fleetMeta = null;
  function paintFresh(){
    if(!fleetMeta){ return; }
    var age = Date.now() - Date.parse(fleetMeta.fetchedAt), stale = age > STALE_MS;
    freshEl.className = 'fresh' + (fleetMeta.demo ? ' demo' : stale ? ' stale' : '');
    freshEl.lastChild.textContent = (fleetMeta.demo ? 'DEMO DATA · ' : stale ? 'Stale · ' : 'Live · ') + 'updated ' + ago(fleetMeta.fetchedAt);
    freshEl.title = 'Last successful sync with the tracking portal: ' + clock(fleetMeta.fetchedAt) + (fleetMeta.lastError ? ' (latest attempt failed: ' + fleetMeta.lastError + ')' : '');
  }
  function loadFleet(){
    return fetch('api/fleet.json', {cache:'no-store', credentials:'same-origin'}).then(function(r){
      if(r.status === 403){ location.href = 'gate'; throw new Error('owner-only'); }
      return r.json();
    }).then(function(j){
      if(!j || !j.available || !Array.isArray(j.vehicles)){ freshEl.className = 'fresh stale'; freshEl.lastChild.textContent = 'No data from the portal yet'; return; }
      fleetMeta = j; vehicles = j.vehicles;
      paintFresh(); refreshViews();
      if(selected){ var v = vehicles.find(function(x){ return x.reg === selected; }); if(v) drawCard(v); }
    }).catch(function(e){ if(e.message !== 'owner-only'){ freshEl.className = 'fresh stale'; freshEl.lastChild.textContent = 'Can’t reach the server'; } });
  }
  function loadTrails(){
    return Promise.all([fetch('api/trail.json?date=' + viewDate, {cache:'no-store', credentials:'same-origin'}).then(function(r){ return r.ok ? r.json() : null; }), loadActivity()])
      .then(function(r){ var j = r[0]; if(j){ trailData = j; drawTrails(); if(selected){ var v = vehicles.find(function(x){ return x.reg === selected; }); if(v) drawCard(v); } } }).catch(function(){});
  }

  loadRoster().then(loadFleet).then(loadTrails).then(function(){
    var want = new URLSearchParams(location.search).get('reg');      // opened from the dashboard: focus that bike
    if(want && vehicles.some(function(x){ return x.reg === want; })){
      select(want, !wantAt);
      if(wantAt){ var items = journey(want), idx = -1;     // opened from a stop in the activity log: open that stop
        items.forEach(function(it, i){ if(it.from === wantAt) idx = i; });
        if(idx >= 0) setTimeout(function(){ openStop(idx); }, 300); }
    }
  });
  setInterval(function(){ if(!document.hidden) loadFleet(); }, FLEET_MS);
  setInterval(function(){ if(!document.hidden && isToday) loadTrails(); }, TRAIL_MS);
  setInterval(paintFresh, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ loadFleet(); loadTrails(); } });
})();
</script>
</body>
</html>
